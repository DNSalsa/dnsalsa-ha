# Publishes the standalone container to ghcr.io/dnsalsa/dnsalsa-ha (amd64 and arm64), tagged like the
# Home Assistant app: the version from dnsalsa/config.yaml (1.0.6), its minor (1.0), and latest.
# Runs on every push to main, but only publishes a version that isn't on GHCR yet: raising the version
# in config.yaml (by hand or through the cloudflared pull request) is the release, same as for the app.
# Run it by hand to publish the current version again (for example after a base image fix).
name: Publish container

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/dnsalsa/dnsalsa-ha

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Version
        id: v
        run: |
          version=$(sed -n 's/^version: "\(.*\)"/\1/p' dnsalsa/config.yaml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = push ] && docker buildx imagetools inspect "$IMAGE:$version" >/dev/null 2>&1; then
            echo "$IMAGE:$version already exists; raise the version in dnsalsa/config.yaml to publish."
            echo "publish=no" >> "$GITHUB_OUTPUT"
          else
            echo "publish=yes" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
        if: steps.v.outputs.publish == 'yes'
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3
        if: steps.v.outputs.publish == 'yes'

      - uses: docker/build-push-action@v6
        if: steps.v.outputs.publish == 'yes'
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
            ${{ env.IMAGE }}:${{ steps.v.outputs.minor }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.title=DNSalsa for Home Assistant
            org.opencontainers.image.description=Your Home Assistant at your own dnsalsa.nl address, through a Cloudflare Tunnel

      - name: Check both architectures
        if: steps.v.outputs.publish == 'yes'
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.v.outputs.version }}"
