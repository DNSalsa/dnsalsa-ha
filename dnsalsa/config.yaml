name: DNSalsa
version: "1.2.0"
slug: dnsalsa
description: Reach your Home Assistant from anywhere with your own dnsalsa.nl address. No port forwarding, no router settings.
url: https://dnsalsa.nl
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
ingress: true
ingress_port: 8099
watchdog: tcp://[HOST]:[PORT:8099]   # Supervisor restarts the app if its web server stops answering
panel_icon: mdi:chili-hot
panel_title: DNSalsa
hassio_api: true
homeassistant_api: true   # to show the DNSalsa sensors in Home Assistant
options:
  server: https://dnsalsa.nl
schema:
  server: url
